<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Map Quiz">
<title>Map Quiz</title>
<style>
  :root{
    --bg:#0f1420; --panel:#182031; --panel-2:#1f2940; --ink:#eef2fb;
    --muted:#8b96b0; --line:#2b3550; --accent:#4f8cff; --accent-ink:#fff;
    --region:#c9d3ea; --region-line:#8894b4; --hi:#ff4d4d; --ok:#2fce8a; --bad:#ff5d6c;
    --key:#2a3450; --key-ink:#eef2fb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100vh; height:100dvh; overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  .wrap{
    width:100%; max-width:560px; height:100%;
    display:flex; flex-direction:column;
    padding:8px 10px calc(6px + env(safe-area-inset-bottom)); gap:6px;
  }
  header{display:flex; align-items:center; gap:8px; flex:0 0 auto}
  .menuBtn{
    flex:0 0 auto; width:38px; height:38px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  h1{font-size:16px; margin:0; font-weight:700; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; flex:1 1 auto}
  .stats{display:flex; gap:6px; flex:0 0 auto}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:4px 9px; text-align:center; min-width:50px}
  .stat b{display:block; font-size:16px; line-height:1.1}
  .stat span{font-size:9px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted)}

  .board{
    position:relative; flex:1 1 auto; min-height:0;
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px;
    display:flex; align-items:center; justify-content:center;
  }
  svg{max-width:100%; max-height:100%; height:auto; width:auto; display:block}
  svg path{fill:var(--region); stroke:var(--region-line); stroke-width:.75; transition:fill .18s ease}
  svg path.hi{fill:var(--hi)}
  svg path.ok{fill:var(--ok)}
  .locator{fill:none; stroke:var(--hi); stroke-width:2; opacity:.9;
    animation:pulse 1.1s ease-in-out infinite; pointer-events:none}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.25);opacity:.35}}
  #flag{display:none; max-width:100%; max-height:100%; border:1px solid var(--line); border-radius:8px}
  body.flagmode #map{display:none}
  body.flagmode #flag{display:block}
  .zoomctl{position:absolute; right:12px; bottom:12px; display:none; flex-direction:column; gap:6px; z-index:5}
  .zoomctl button{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--line);
    background:rgba(24,32,49,.82); color:var(--ink); font-size:22px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(3px);
  }

  .prompt{font-size:13px; color:var(--muted); text-align:center; flex:0 0 auto; min-height:18px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .answer{
    flex:0 0 auto;
    font-size:22px; font-weight:600; min-height:52px; padding:11px 14px; border-radius:12px;
    border:1px solid var(--line); background:var(--panel-2);
    display:flex; align-items:center; overflow:hidden; white-space:nowrap;
  }
  .answer.empty{color:var(--muted); font-weight:400}
  .answer.ok{border-color:var(--ok); color:var(--ok)}
  .answer.bad{border-color:var(--bad); color:var(--bad)}
  .caret{display:inline-block; width:2px; height:24px; background:var(--accent);
    margin-left:2px; animation:blink 1s steps(2,start) infinite}
  @keyframes blink{50%{opacity:0}}

  .feedback{flex:0 0 auto; min-height:20px; font-size:14px; font-weight:600; text-align:center}
  .feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)} .feedback.muted{color:var(--muted)}

  .suggest{flex:0 0 auto; display:flex; gap:6px; overflow-x:auto; min-height:40px; padding:1px; scrollbar-width:none}
  .suggest::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto; background:var(--accent); color:var(--accent-ink);
    border:none; border-radius:10px; padding:9px 14px; font-size:15px; font-weight:600; cursor:pointer; white-space:nowrap}
  .chip.alt{background:var(--panel-2); color:var(--ink); border:1px solid var(--line)}

  .options{flex:0 0 auto; display:none; grid-template-columns:1fr 1fr; gap:8px}
  .option{
    min-height:48px; border:1px solid var(--line); border-radius:12px; background:var(--panel-2);
    color:var(--ink); font-size:16px; font-weight:600; cursor:pointer; padding:6px 10px;
    display:flex; align-items:center; justify-content:center; text-align:center;
  }
  .option.ok{background:#1c4634; border-color:var(--ok); color:#8ff0c4}
  .option.bad{background:#4a2530; border-color:var(--bad); color:#ffb3bc}
  .easyActions{flex:0 0 auto; display:none; gap:8px; align-items:stretch; margin-top:8px}
  .nextBtn{flex:1.3 1 0; min-width:0;
    padding:15px 14px; border:1px solid transparent; border-radius:12px; background:var(--accent); color:var(--accent-ink);
    font-size:18px; font-weight:700; cursor:pointer}
  .nextBtn:disabled{background:var(--panel-2); color:var(--muted); border:1px solid var(--line); cursor:default}
  .showBtn{flex:1 1 0; min-width:0; padding:15px 8px; border:1px solid var(--line); border-radius:12px;
    background:var(--panel-2); color:var(--muted); font-size:13px; font-weight:600; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  .mapModal{position:fixed; z-index:32; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(560px,94vw); display:none; flex-direction:column; gap:10px;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
  .mapModal.open{display:flex}
  .mapModalBoard{position:relative; background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:8px; height:min(58vh,420px); display:flex; align-items:center; justify-content:center}
  .mapModalBoard svg{max-width:100%; max-height:100%}

  .kb{flex:0 0 auto; display:flex; flex-direction:column; gap:5px}
  .krow{display:flex; gap:5px; justify-content:center}
  .key{
    flex:1 1 0; min-width:0; height:46px; border:none; border-radius:8px;
    background:var(--key); color:var(--key-ink); font-size:17px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .key:active{background:var(--accent)}
  .key.wide{flex:1.5 1 0; font-size:15px}
  .key.hint{flex:1.5 1 0; font-size:18px}
  .key.space{flex:4 1 0; font-size:14px; color:var(--muted)}
  .key.go{flex:2 1 0; background:var(--accent); color:var(--accent-ink)}

  /* difficulty-driven visibility */
  #options{display:none}
  body.mode-easy #answer, body.mode-easy #suggest, body.mode-easy #kb{display:none}
  body.mode-easy #options{display:grid}
  body.mode-easy #easyActions{display:flex}

  /* menu */
  .backdrop{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:30; display:none}
  .backdrop.open{display:block}
  .menu{
    position:fixed; top:0; left:0; bottom:0; width:min(320px,86vw); z-index:31;
    background:var(--panel); border-right:1px solid var(--line);
    transform:translateX(-100%); transition:transform .2s ease;
    display:flex; flex-direction:column; padding:16px 14px calc(16px + env(safe-area-inset-bottom));
    gap:8px; overflow-y:auto;
  }
  .menu.open{transform:translateX(0)}
  .menu h2{font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:14px 2px 6px}
  .menu h2:first-child{margin-top:0}
  .gameItem{
    display:flex; align-items:center; gap:12px; text-align:left;
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; color:var(--ink); font-size:16px; font-weight:600; cursor:pointer;
  }
  .gameItem.active{border-color:var(--accent); background:#243352}
  .gameItem .em{font-size:20px}
  .gameItem .meta{margin-left:auto; font-size:11px; color:var(--muted); font-weight:500; text-align:right}
  .seg{display:flex; gap:6px}
  .seg button{
    flex:1; padding:10px 4px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--ink); font-size:14px; font-weight:600; cursor:pointer;
  }
  .seg button.active{border-color:var(--accent); background:#243352}
  .caption{font-size:11px; color:var(--muted); margin:6px 2px 0; line-height:1.4}
  .setRow{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:4px}
  .setRow span{font-size:15px; font-weight:600}
  .toggle{width:52px; height:30px; border-radius:16px; border:1px solid var(--line);
    background:var(--panel-2); position:relative; cursor:pointer}
  .toggle::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px;
    border-radius:50%; background:var(--muted); transition:all .15s ease}
  .toggle.on{background:#243352; border-color:var(--accent)}
  .toggle.on::after{left:27px; background:var(--accent)}
  .nameInput{width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--ink); font-size:15px; margin-bottom:8px}
  .nameInput:focus{outline:none; border-color:var(--accent)}
  .lbBtn{width:100%; padding:13px; border:none; border-radius:12px; background:var(--accent);
    color:var(--accent-ink); font-size:16px; font-weight:700; cursor:pointer}

  /* leaderboard panel */
  .lbPanel{
    position:fixed; z-index:32; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(460px,92vw); max-height:88vh; display:none; flex-direction:column; gap:10px;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .lbPanel.open{display:flex}
  .lbHead{display:flex; align-items:center; justify-content:space-between}
  .lbHead h2{margin:0; font-size:18px}
  .lbClose{width:34px; height:34px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--ink); font-size:15px; cursor:pointer}
  .lbTabs{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none}
  .lbTabs::-webkit-scrollbar{display:none}
  .lbTab{flex:0 0 auto; padding:8px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--ink); font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap}
  .lbTab.active{border-color:var(--accent); background:#243352}
  .lbList{overflow-y:auto; display:flex; flex-direction:column; gap:4px; min-height:120px}
  .lbRow{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:var(--panel-2)}
  .lbRow .rank{width:26px; color:var(--muted); font-weight:700; text-align:right}
  .lbRow .who{flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lbRow .val{font-weight:700; color:var(--ok)}
  .lbRow.me{border:1px solid var(--accent)}
  .lbNote{color:var(--muted); font-size:14px; text-align:center; padding:24px 8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="menuBtn" class="menuBtn" aria-label="Menu">☰</button>
    <h1 id="title">Map Quiz</h1>
    <div class="stats">
      <div class="stat"><b id="streak">0</b><span>Streak</span></div>
      <div class="stat"><b id="best">0</b><span>Best</span></div>
      <div class="stat"><b id="score">0/0</b><span>Score</span></div>
    </div>
  </header>

  <div class="board">
    <svg id="map" viewBox="0 0 959 593" role="img" aria-label="Map"></svg>
    <img id="flag" alt="Flag to identify">
    <div id="zoomctl" class="zoomctl">
      <button id="zoomIn" aria-label="Zoom in">+</button>
      <button id="zoomOut" aria-label="Zoom out">−</button>
    </div>
  </div>

  <div id="prompt" class="prompt"></div>
  <div id="answer" class="answer empty"></div>
  <div id="feedback" class="feedback"></div>
  <div id="suggest" class="suggest"></div>
  <div id="options" class="options"></div>
  <div id="easyActions" class="easyActions">
    <button id="showWrong" class="showBtn" style="display:none"></button>
    <button id="nextBtn" class="nextBtn">Next →</button>
    <button id="showCorrect" class="showBtn" style="display:none"></button>
  </div>
  <div id="kb" class="kb"></div>
</div>

<div id="backdrop" class="backdrop"></div>
<nav id="menu" class="menu">
  <h2>Choose a game</h2>
  <div id="gameList"></div>
  <h2>Difficulty</h2>
  <div class="seg" id="diffSeg">
    <button data-d="easy">Easy</button>
    <button data-d="hard">Hard</button>
  </div>
  <div id="diffCaption" class="caption"></div>
  <h2>Options</h2>
  <div class="setRow"><span>Auto-zoom (World map)</span><button id="zoomToggle" class="toggle"></button></div>
  <div id="lbMenu" style="display:none">
    <h2>Leaderboard</h2>
    <input id="nameInput" class="nameInput" maxlength="16" placeholder="Your name (for the leaderboard)">
    <button id="viewLb" class="lbBtn">🏆 View leaderboard</button>
  </div>
</nav>

<div id="mapModalBg" class="backdrop"></div>
<div id="mapModal" class="mapModal">
  <div class="lbHead"><h2 id="mapModalTitle">🌍</h2><button id="mapModalClose" class="lbClose" aria-label="Close">✕</button></div>
  <div class="mapModalBoard">
    <svg id="mapModalSvg" viewBox="0 0 2000 1001" role="img" aria-label="Country location"></svg>
    <div class="zoomctl" style="display:flex">
      <button id="mapModalIn" aria-label="Zoom in">+</button>
      <button id="mapModalOut" aria-label="Zoom out">−</button>
    </div>
  </div>
</div>

<div id="lbBackdrop" class="backdrop"></div>
<div id="lbPanel" class="lbPanel">
  <div class="lbHead">
    <h2>🏆 Leaderboard</h2>
    <button id="lbClose" class="lbClose" aria-label="Close">✕</button>
  </div>
  <div id="lbTabs" class="lbTabs"></div>
  <div class="seg" id="lbDiffSeg">
    <button data-d="easy">Easy</button>
    <button data-d="hard">Hard</button>
  </div>
  <div id="lbList" class="lbList"></div>
</div>

<!-- data -->
<script src="config.js"></script>
<script src="data/states.js"></script>
<script src="data/countries.js"></script>
<script src="data/counties.js"></script>
<script src="data/flags.js"></script>
<script>
const G = window.G || {};
const GAMES = {
  states:    {title:"US States",        em:"🇺🇸", type:"map",  prompt:"Which state is highlighted?",   data:()=>G.states},
  countries: {title:"World Countries",  em:"🌍", type:"map",  prompt:"Which country is highlighted?", data:()=>G.countries, autozoom:true},
  counties:  {title:"England Counties", em:"🏴", type:"map",  prompt:"Which county is highlighted?",  data:()=>G.counties},
  flags:     {title:"Name the Flag",    em:"🚩", type:"flag", prompt:"Which country's flag is this?", data:()=>G.flags},
};
const ORDER = ["states","countries","counties","flags"];
const DIFF_CAPTION = {
  easy: "Tap one of 6 options.",
  hard: "Type the answer — suggestions help with spelling. 💡 gives a hint.",
};

const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/['’.,\-]/g,"").replace(/\s+/g," ").trim();
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const $ = id => document.getElementById(id);

const svg=$("map"), flagImg=$("flag");
const elTitle=$("title"), elPrompt=$("prompt"), elStreak=$("streak"), elBest=$("best"), elScore=$("score");
const elAnswer=$("answer"), elFeedback=$("feedback"), elSuggest=$("suggest"), elOptions=$("options"), elKb=$("kb");

// ---- settings ----
let difficulty = localStorage.getItem("nts_diff")==="easy" ? "easy" : "hard";
let zoomOn = localStorage.getItem("nts_zoom") !== "off";

// ---- leaderboard ----
const LB_API = (window.LEADERBOARD_API || "").replace(/\/+$/,"");
const LB_ON = !!LB_API;
let playerName = localStorage.getItem("nts_name") || "";

// ---- per-game state ----
let gameId, game, codeList=[], nameByCode={}, NAME_TO_CODE={}, NAMES=[];
let bag=[], current=null, answered=false, buffer="", lastGuess=null, hintLevel=0;
let streak=0, correct=0, total=0, best=0;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function addName(name,code){ NAME_TO_CODE[norm(name)] = code; }
function bestKey(){ return "nts_best_"+gameId+"_"+difficulty; }

// A self-contained map + zoom view bound to one <svg>. Used by the main board
// and by the "show me on the map" popup, so both share identical zoom behaviour.
function createMapView(svgEl){
  const st={ paths:{}, fullVB:null, zoomLevels:[1], zoomIdx:0, curCenter:null, rafId:0, autozoom:false };
  const setVB = v => svgEl.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`);
  const curVB = () => { const v=svgEl.viewBox.baseVal; return {x:v.x,y:v.y,w:v.width,h:v.height}; };
  function animateVB(from,to,dur){
    cancelAnimationFrame(st.rafId);
    const t0=performance.now(), ease=t=>1-Math.pow(1-t,3);
    (function step(now){
      const t=Math.min(1,(now-t0)/dur), e=ease(t);
      setVB({x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e,
             w:from.w+(to.w-from.w)*e, h:from.h+(to.h-from.h)*e});
      if(t<1) st.rafId=requestAnimationFrame(step);
    })(t0);
  }
  function build(d, codes){
    svgEl.innerHTML=""; st.paths={};
    codes.forEach(code=>{
      const p=document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("d", d[code].d); p.dataset.code=code;
      svgEl.appendChild(p); st.paths[code]=p;
    });
    const bb=svgEl.getBBox(), pad=Math.max(bb.width,bb.height)*0.02;
    st.fullVB={x:bb.x-pad, y:bb.y-pad, w:bb.width+2*pad, h:bb.height+2*pad};
    setVB(st.fullVB);
  }
  function vbForLevel(s){
    const vw=st.fullVB.w*s, vh=st.fullVB.h*s;
    const cx=clamp(st.curCenter.x, st.fullVB.x+vw/2, st.fullVB.x+st.fullVB.w-vw/2);
    const cy=clamp(st.curCenter.y, st.fullVB.y+vh/2, st.fullVB.y+st.fullVB.h-vh/2);
    return {x:cx-vw/2, y:cy-vh/2, w:vw, h:vh};
  }
  function highlight(code){
    cancelAnimationFrame(st.rafId);
    [...svgEl.querySelectorAll(".locator")].forEach(n=>n.remove());
    Object.values(st.paths).forEach(p=>p.setAttribute("class",""));
    st.paths[code].setAttribute("class","hi");
    const rb=st.paths[code].getBBox();
    st.curCenter={x:rb.x+rb.width/2, y:rb.y+rb.height/2};
    const targetFrac=0.5, minS=0.08;
    const frac=Math.max(rb.width/st.fullVB.w, rb.height/st.fullVB.h);
    const s=Math.min(1, Math.max(minS, frac/targetFrac));
    st.zoomLevels = s>=0.97 ? [1] : [s, Math.sqrt(s), 1];
    const auto=!!st.autozoom;
    st.zoomIdx = auto ? 0 : st.zoomLevels.length-1;
    const targetVB=vbForLevel(st.zoomLevels[st.zoomIdx]);
    if(auto){ setVB(st.fullVB); animateVB(st.fullVB, targetVB, 550); } else setVB(st.fullVB);
    const primary = auto ? targetVB : st.fullVB;
    const pdiag=Math.hypot(primary.w,primary.h), rdiag=Math.hypot(rb.width,rb.height);
    if(rdiag < pdiag*0.14){
      const r=Math.max(rdiag*1.1, pdiag*0.05);
      const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("cx",st.curCenter.x); c.setAttribute("cy",st.curCenter.y); c.setAttribute("r",r);
      c.setAttribute("class","locator"); c.style.transformOrigin=`${st.curCenter.x}px ${st.curCenter.y}px`;
      svgEl.appendChild(c);
    }
  }
  function stepZoom(delta){
    if(!st.curCenter) return;
    st.zoomIdx=clamp(st.zoomIdx+delta, 0, st.zoomLevels.length-1);
    animateVB(curVB(), vbForLevel(st.zoomLevels[st.zoomIdx]), 300);
  }
  return {
    build, highlight, stepZoom,
    revealCorrect: code => { if(st.paths[code]) st.paths[code].setAttribute("class","ok"); },
    set autozoom(v){ st.autozoom=v; },
  };
}

const mainView = createMapView(svg);
function buildMap(d){ mainView.build(d, codeList); }

function applyMode(){
  document.body.classList.remove("mode-easy","mode-medium","mode-hard");
  document.body.classList.add("mode-"+difficulty);
}

function loadGame(id){
  gameId=id; game=GAMES[id];
  applyMode();
  document.body.classList.toggle("flagmode", game.type==="flag");
  const d=game.data();
  nameByCode={}; NAME_TO_CODE={};
  if(game.type==="map"){
    codeList=Object.keys(d);
    codeList.forEach(c=>{ nameByCode[c]=d[c].name; addName(d[c].name,c); (d[c].alt||[]).forEach(a=>addName(a,c)); });
    buildMap(d);
  } else {
    codeList=d.map(x=>x.c);
    d.forEach(x=>{ nameByCode[x.c]=x.n; addName(x.n,x.c); (x.alt||[]).forEach(a=>addName(a,x.c)); });
  }
  NAMES = codeList.map(c=>nameByCode[c]);
  best=+(localStorage.getItem(bestKey())||0);
  streak=0; correct=0; total=0; bag=[];
  elBest.textContent=best; elStreak.textContent=0; elScore.textContent="0/0";
  elTitle.textContent=game.title;
  localStorage.setItem("nts_last", id);
  updateZoomCtl(); closeMenu(); nextQuestion();
}

// ---- highlight + zoom (main board delegates to mainView) ----
function highlight(code){
  mainView.autozoom = !!(game.autozoom && zoomOn);   // auto-zoom only on the World map
  mainView.highlight(code);
}
function stepZoom(delta){ if(game.type==="map") mainView.stepZoom(delta); }
function revealCorrect(code){ mainView.revealCorrect(code); }
function updateZoomCtl(){ $("zoomctl").style.display = (game.type==="map") ? "flex" : "none"; }

// ---- autocomplete + typing display ----
function computeMatches(q){
  const n=norm(q); if(!n) return [];
  const starts=[], contains=[];
  NAMES.forEach(name=>{ const nn=norm(name);
    if(nn.startsWith(n)) starts.push(name); else if(nn.includes(n)) contains.push(name);
  });
  return starts.concat(contains).slice(0,6);
}
function render(){
  if(buffer){ elAnswer.textContent=buffer; elAnswer.classList.remove("empty"); }
  else { elAnswer.textContent="Type your answer…"; elAnswer.classList.add("empty"); }
  if(!answered){ const c=document.createElement("span"); c.className="caret"; elAnswer.appendChild(c); }
  elSuggest.innerHTML="";
  if(!answered && difficulty!=="easy"){
    computeMatches(buffer).forEach((name,i)=>{
      const b=document.createElement("button");
      b.className="chip"+(i===0?"":" alt"); b.textContent=name;
      b.addEventListener("click", ()=>{ buffer=name; submit(); });
      elSuggest.appendChild(b);
    });
  }
}

// ---- easy-mode options ----
let optionBtns={};
function buildOptions(){
  elOptions.innerHTML=""; optionBtns={};
  const others=shuffle(codeList.filter(c=>c!==current)).slice(0,5);
  shuffle([current,...others]).forEach(code=>{
    const b=document.createElement("button"); b.className="option"; b.textContent=nameByCode[code];
    b.addEventListener("click", ()=>{ if(!answered) evaluateGuess(code); });
    elOptions.appendChild(b); optionBtns[code]=b;
  });
}
function markOptions(){
  if(optionBtns[current]) optionBtns[current].classList.add("ok");
  if(lastGuess && lastGuess!==current && optionBtns[lastGuess]) optionBtns[lastGuess].classList.add("bad");
}

// ---- hint ----
function useHint(){
  if(answered || difficulty==="easy") return;
  const letters=nameByCode[current].replace(/[^A-Za-z]/g,"").length;
  hintLevel=Math.min(hintLevel+1, letters);
  renderHint();
}
function renderHint(){
  if(hintLevel<=0){ elPrompt.textContent=game.prompt; return; }
  let count=0, out="";
  for(const ch of nameByCode[current]){
    if(/[A-Za-z]/.test(ch)){ out+=(count<hintLevel?ch:"_")+" "; count++; }
    else out+="  ";
  }
  elPrompt.textContent="Hint: "+out.trim();
}

// ---- round flow ----
function nextQuestion(){
  if(bag.length===0) bag=shuffle(codeList.slice());
  current=bag.pop(); answered=false; buffer=""; lastGuess=null; hintLevel=0;
  if(game.type==="map") highlight(current); else flagImg.src="flags/"+current+".svg";
  elAnswer.classList.remove("ok","bad");
  elFeedback.textContent=""; elFeedback.className="feedback";
  elPrompt.textContent=game.prompt;
  $("nextBtn").disabled=true;
  $("showWrong").style.display="none"; $("showCorrect").style.display="none";
  setEnterLabel();
  if(difficulty==="easy") buildOptions(); else render();
}

function evaluateGuess(guessCode){
  if(answered || !guessCode) return;
  answered=true; total++; lastGuess=guessCode;
  const answerName=nameByCode[current];
  if(guessCode===current){
    correct++; streak++;
    if(streak>best){ best=streak; localStorage.setItem(bestKey(),best); elBest.textContent=best; submitScore(); }
    if(game.type==="map") revealCorrect(current);
    elAnswer.classList.add("ok");
    elFeedback.textContent="✓ Correct — "+answerName; elFeedback.className="feedback ok";
  } else {
    streak=0;
    if(game.type==="map") revealCorrect(current);
    elAnswer.classList.add("bad");
    elFeedback.textContent="✗ That's "+answerName; elFeedback.className="feedback bad";
  }
  buffer=answerName;
  elStreak.textContent=streak; elScore.textContent=correct+"/"+total;
  setEnterLabel();
  if(difficulty==="easy"){ markOptions(); $("nextBtn").disabled=false; setupShowButtons(guessCode); } else render();
}

function submit(){
  if(answered || !buffer.trim()) return;
  let g=NAME_TO_CODE[norm(buffer)];
  if(!g && difficulty!=="easy"){ const m=computeMatches(buffer); if(m.length) g=NAME_TO_CODE[norm(m[0])]; }
  if(!g){ elFeedback.textContent="Keep typing…"; elFeedback.className="feedback muted"; return; }
  evaluateGuess(g);
}

// ---- on-screen keyboard ----
const LAYOUT=[
  ["Q","W","E","R","T","Y","U","I","O","P"],
  ["A","S","D","F","G","H","J","K","L"],
  ["Z","X","C","V","B","N","M","back"],
  ["hint","space","enter"]
];
let enterBtn=null;
function setEnterLabel(){ if(enterBtn) enterBtn.textContent = answered ? "Next" : "Enter"; }
function handleKey(act,ch){
  if(act==="hint"){ useHint(); return; }
  if(answered){ if(act==="enter") nextQuestion(); return; }
  if(difficulty==="easy") return;
  if(act==="char"){ if(buffer.replace(/\s/g,"").length<28) buffer += ch; }
  else if(act==="space"){ if(buffer && !buffer.endsWith(" ")) buffer+=" "; }
  else if(act==="back"){ buffer=buffer.slice(0,-1); }
  else if(act==="enter"){ submit(); return; }
  render();
}
LAYOUT.forEach(row=>{
  const r=document.createElement("div"); r.className="krow";
  row.forEach(key=>{
    const b=document.createElement("button"); b.className="key";
    if(key==="back"){ b.textContent="⌫"; b.classList.add("wide"); b.dataset.act="back"; }
    else if(key==="hint"){ b.textContent="💡"; b.classList.add("hint"); b.dataset.act="hint"; }
    else if(key==="space"){ b.textContent="space"; b.classList.add("space"); b.dataset.act="space"; }
    else if(key==="enter"){ b.textContent="Enter"; b.classList.add("go"); b.dataset.act="enter"; enterBtn=b; }
    else { b.textContent=key; b.dataset.act="char"; b.dataset.ch=key; }
    b.addEventListener("click", ()=>handleKey(b.dataset.act, b.dataset.ch));
    r.appendChild(b);
  });
  elKb.appendChild(r);
});
document.addEventListener("keydown", e=>{
  if($("menu").classList.contains("open")){ if(e.key==="Escape") closeMenu(); return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="Enter"){ e.preventDefault(); handleKey("enter"); }
  else if(difficulty==="easy") return;
  else if(e.key==="Backspace"){ e.preventDefault(); handleKey("back"); }
  else if(e.key===" "){ e.preventDefault(); handleKey("space"); }
  else if(/^[a-zA-Z]$/.test(e.key)){ handleKey("char", e.key.toUpperCase()); }
});
$("zoomIn").addEventListener("click", ()=>stepZoom(-1));
$("zoomOut").addEventListener("click", ()=>stepZoom(1));
$("nextBtn").addEventListener("click", ()=>{ if(answered) nextQuestion(); });

// ---- menu + settings ----
function openMenu(){ buildMenu(); updateSettingsUI(); $("menu").classList.add("open"); $("backdrop").classList.add("open"); }
function closeMenu(){ $("menu").classList.remove("open"); $("backdrop").classList.remove("open"); }
function buildMenu(){
  const list=$("gameList"); list.innerHTML="";
  ORDER.forEach(id=>{
    const g=GAMES[id];
    const b=document.createElement("button");
    b.className="gameItem"+(id===gameId?" active":"");
    const bs=+(localStorage.getItem("nts_best_"+id+"_"+difficulty)||0);
    b.innerHTML=`<span class="em">${g.em}</span><span>${g.title}</span><span class="meta">best<br>${bs}</span>`;
    b.addEventListener("click", ()=>loadGame(id));
    list.appendChild(b);
  });
}
function updateSettingsUI(){
  [...$("diffSeg").children].forEach(b=>b.classList.toggle("active", b.dataset.d===difficulty));
  $("diffCaption").textContent=DIFF_CAPTION[difficulty];
  $("zoomToggle").classList.toggle("on", zoomOn);
  $("lbMenu").style.display = LB_ON ? "block" : "none";
  $("nameInput").value = playerName;
}
[...$("diffSeg").children].forEach(b=>b.addEventListener("click", ()=>{
  if(b.dataset.d===difficulty){ updateSettingsUI(); return; }
  difficulty=b.dataset.d; localStorage.setItem("nts_diff", difficulty);
  updateSettingsUI(); buildMenu(); loadGame(gameId);
}));
$("zoomToggle").addEventListener("click", ()=>{
  zoomOn=!zoomOn; localStorage.setItem("nts_zoom", zoomOn?"on":"off");
  updateSettingsUI(); updateZoomCtl();
  if(game.type==="map") highlight(current);
});
$("menuBtn").addEventListener("click", openMenu);
$("backdrop").addEventListener("click", closeMenu);

// ---- leaderboard ----
let lbGame="states", lbDiff="hard";
function submitScore(){
  if(!LB_ON || !playerName || best<=0) return;
  fetch(LB_API+"/score", {method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({game:gameId, diff:difficulty, name:playerName, streak:best})}).catch(()=>{});
}
function openLb(){
  closeMenu();
  lbGame=gameId; lbDiff=difficulty;
  buildLbTabs(); updateLbDiff();
  $("lbPanel").classList.add("open"); $("lbBackdrop").classList.add("open");
  loadBoard();
}
function closeLb(){ $("lbPanel").classList.remove("open"); $("lbBackdrop").classList.remove("open"); }
function buildLbTabs(){
  const t=$("lbTabs"); t.innerHTML="";
  ORDER.forEach(id=>{
    const b=document.createElement("button");
    b.className="lbTab"+(id===lbGame?" active":"");
    b.textContent=GAMES[id].em+" "+GAMES[id].title;
    b.addEventListener("click", ()=>{ lbGame=id; buildLbTabs(); loadBoard(); });
    t.appendChild(b);
  });
}
function updateLbDiff(){
  [...$("lbDiffSeg").children].forEach(b=>b.classList.toggle("active", b.dataset.d===lbDiff));
}
function loadBoard(){
  const list=$("lbList");
  list.innerHTML='<div class="lbNote">Loading…</div>';
  fetch(`${LB_API}/leaderboard?game=${encodeURIComponent(lbGame)}&diff=${encodeURIComponent(lbDiff)}`)
    .then(r=>r.json())
    .then(rows=>{
      if(!Array.isArray(rows) || rows.length===0){ list.innerHTML='<div class="lbNote">No scores yet — be the first!</div>'; return; }
      list.innerHTML="";
      rows.forEach((row,i)=>{
        const d=document.createElement("div");
        d.className="lbRow"+(row.name===playerName?" me":"");
        d.innerHTML=`<span class="rank">${i+1}</span><span class="who"></span><span class="val">${row.streak}</span>`;
        d.querySelector(".who").textContent=row.name;
        list.appendChild(d);
      });
    })
    .catch(()=>{ list.innerHTML='<div class="lbNote">Couldn\'t load the leaderboard.<br>Check your connection.</div>'; });
}
$("nameInput").addEventListener("input", e=>{ playerName=e.target.value.trim().slice(0,16); localStorage.setItem("nts_name", playerName); });
$("nameInput").addEventListener("change", ()=>submitScore());
$("viewLb").addEventListener("click", openLb);
$("lbClose").addEventListener("click", closeLb);
$("lbBackdrop").addEventListener("click", closeLb);
[...$("lbDiffSeg").children].forEach(b=>b.addEventListener("click", ()=>{ lbDiff=b.dataset.d; updateLbDiff(); loadBoard(); }));

// ---- "show me on the map" popup (flag game, easy mode) ----
let popupView=null, popupBuilt=false;
function showOnMap(mapCode, name){
  $("mapModalTitle").textContent = "🌍 " + name;
  $("mapModal").classList.add("open"); $("mapModalBg").classList.add("open");
  requestAnimationFrame(()=>{
    if(!popupView) popupView=createMapView($("mapModalSvg"));
    if(!popupBuilt){ popupView.build(G.countries, Object.keys(G.countries)); popupBuilt=true; }
    popupView.autozoom = zoomOn;
    popupView.highlight(mapCode);
  });
}
function closeMapModal(){ $("mapModal").classList.remove("open"); $("mapModalBg").classList.remove("open"); }
function setupShowButtons(guessCode){
  const sw=$("showWrong"), sc=$("showCorrect");
  sw.style.display="none"; sc.style.display="none";
  if(gameId!=="flags") return;
  const cMap=current.toUpperCase();
  if(G.countries[cMap]){ sc.style.display=""; sc.textContent="📍 "+nameByCode[current]; sc.dataset.code=cMap; sc.dataset.name=nameByCode[current]; }
  if(guessCode!==current){
    const gMap=guessCode.toUpperCase();
    if(G.countries[gMap]){ sw.style.display=""; sw.textContent="📍 "+nameByCode[guessCode]; sw.dataset.code=gMap; sw.dataset.name=nameByCode[guessCode]; }
  }
}
$("showCorrect").addEventListener("click", ()=>{ const b=$("showCorrect"); if(b.dataset.code) showOnMap(b.dataset.code, b.dataset.name); });
$("showWrong").addEventListener("click", ()=>{ const b=$("showWrong"); if(b.dataset.code) showOnMap(b.dataset.code, b.dataset.name); });
$("mapModalClose").addEventListener("click", closeMapModal);
$("mapModalBg").addEventListener("click", closeMapModal);
$("mapModalIn").addEventListener("click", ()=>{ if(popupView) popupView.stepZoom(-1); });
$("mapModalOut").addEventListener("click", ()=>{ if(popupView) popupView.stepZoom(1); });

// ---- start ----
const last=localStorage.getItem("nts_last");
loadGame(GAMES[last] ? last : "states");

// ---- PWA: register service worker for offline + installability ----
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
