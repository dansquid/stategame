<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>Name the State</title>
<style>
  :root{
    --bg:#0f1420; --panel:#182031; --panel-2:#1f2940; --ink:#eef2fb;
    --muted:#8b96b0; --line:#2b3550; --accent:#4f8cff; --accent-ink:#fff;
    --state:#c9d3ea; --state-line:#8894b4; --hi:#ff4d4d; --ok:#2fce8a; --bad:#ff5d6c;
    --key:#2a3450; --key-ink:#eef2fb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100vh; height:100dvh; overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  .wrap{
    width:100%; max-width:560px; height:100%;
    display:flex; flex-direction:column;
    padding:8px 10px calc(6px + env(safe-area-inset-bottom)); gap:6px;
  }
  header{display:flex; align-items:center; justify-content:space-between; gap:8px; flex:0 0 auto}
  h1{font-size:16px; margin:0; font-weight:700; white-space:nowrap}
  .stats{display:flex; gap:6px}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:4px 9px; text-align:center; min-width:52px}
  .stat b{display:block; font-size:16px; line-height:1.1}
  .stat span{font-size:9px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted)}

  .mapcard{
    flex:1 1 auto; min-height:0;
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px;
    display:flex; align-items:center; justify-content:center;
  }
  svg{max-width:100%; max-height:100%; height:auto; width:auto; display:block}
  svg path{fill:var(--state); stroke:var(--state-line); stroke-width:.75; transition:fill .18s ease}
  svg path.hi{fill:var(--hi)}
  svg path.ok{fill:var(--ok)}

  .prompt{font-size:13px; color:var(--muted); text-align:center; flex:0 0 auto}
  .answer{
    flex:0 0 auto;
    font-size:22px; font-weight:600; min-height:52px; padding:11px 14px; border-radius:12px;
    border:1px solid var(--line); background:var(--panel-2);
    display:flex; align-items:center; overflow:hidden; white-space:nowrap;
  }
  .answer.empty{color:var(--muted); font-weight:400}
  .answer.ok{border-color:var(--ok); color:var(--ok)}
  .answer.bad{border-color:var(--bad); color:var(--bad)}
  .caret{display:inline-block; width:2px; height:24px; background:var(--accent);
    margin-left:2px; animation:blink 1s steps(2,start) infinite}
  @keyframes blink{50%{opacity:0}}

  .feedback{flex:0 0 auto; min-height:20px; font-size:14px; font-weight:600; text-align:center}
  .feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)} .feedback.muted{color:var(--muted)}

  .suggest{flex:0 0 auto; display:flex; gap:6px; overflow-x:auto; min-height:40px; padding:1px;
    scrollbar-width:none}
  .suggest::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto; background:var(--accent); color:var(--accent-ink);
    border:none; border-radius:10px; padding:9px 14px; font-size:15px; font-weight:600; cursor:pointer}
  .chip.alt{background:var(--panel-2); color:var(--ink); border:1px solid var(--line)}

  .kb{flex:0 0 auto; display:flex; flex-direction:column; gap:5px}
  .krow{display:flex; gap:5px; justify-content:center}
  .key{
    flex:1 1 0; min-width:0; height:46px; border:none; border-radius:8px;
    background:var(--key); color:var(--key-ink); font-size:17px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .key:active{background:var(--accent)}
  .key.wide{flex:1.6 1 0; font-size:15px}
  .key.space{flex:5 1 0; font-size:14px; color:var(--muted)}
  .key.go{flex:2 1 0; background:var(--accent); color:var(--accent-ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Name the State</h1>
    <div class="stats">
      <div class="stat"><b id="streak">0</b><span>Streak</span></div>
      <div class="stat"><b id="best">0</b><span>Best</span></div>
      <div class="stat"><b id="score">0/0</b><span>Score</span></div>
    </div>
  </header>

  <div class="mapcard">
    <svg id="map" viewBox="0 0 959 593" role="img" aria-label="Map of the United States"></svg>
  </div>

  <div class="prompt">Which state is highlighted?</div>
  <div id="answer" class="answer empty"></div>
  <div id="feedback" class="feedback"></div>
  <div id="suggest" class="suggest"></div>
  <div id="kb" class="kb"></div>
</div>

const CODES = Object.keys(STATES);
const NAMES = CODES.map(c => STATES[c].name);

const norm = s => s.toLowerCase().trim().replace(/[.\-]/g,"").replace(/\s+/g," ");
const NAME_TO_CODE = {};
CODES.forEach(c => { NAME_TO_CODE[norm(STATES[c].name)] = c; });
const titleCase = s => s.replace(/\b[a-z]/g, m => m.toUpperCase());

// ---- map ----
const svg = document.getElementById("map");
const paths = {};
CODES.forEach(code => {
  const p = document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d", STATES[code].d);
  p.dataset.code = code;
  svg.appendChild(p);
  paths[code] = p;
});

// ---- state ----
let bag = [], current = null, answered = false, buffer = "";
let streak = 0, correct = 0, total = 0;
let best = +(localStorage.getItem("nts_best") || 0);

const $ = id => document.getElementById(id);
const elStreak=$("streak"), elBest=$("best"), elScore=$("score");
const elAnswer=$("answer"), elFeedback=$("feedback"), elSuggest=$("suggest"), elKb=$("kb");
elBest.textContent = best;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function computeMatches(q){
  const n = norm(q); if(!n) return [];
  const starts=[], contains=[];
  NAMES.forEach(name=>{ const nn=norm(name);
    if(nn.startsWith(n)) starts.push(name); else if(nn.includes(n)) contains.push(name);
  });
  return starts.concat(contains).slice(0,6);
}

function render(){
  if(buffer){ elAnswer.textContent = titleCase(buffer); elAnswer.classList.remove("empty"); }
  else { elAnswer.textContent = "Type the state name…"; elAnswer.classList.add("empty"); }
  if(!answered){
    const c = document.createElement("span"); c.className = "caret"; elAnswer.appendChild(c);
  }
  // suggestions
  elSuggest.innerHTML = "";
  if(!answered){
    computeMatches(buffer).forEach((name,i)=>{
      const b = document.createElement("button");
      b.className = "chip" + (i===0 ? "" : " alt");
      b.textContent = name;
      b.addEventListener("click", ()=>{ buffer = name.toLowerCase(); submit(); });
      elSuggest.appendChild(b);
    });
  }
}

function nextQuestion(){
  if(bag.length === 0) bag = shuffle(CODES.slice());
  current = bag.pop();
  answered = false; buffer = "";
  Object.values(paths).forEach(p => p.className.baseVal = "");
  paths[current].className.baseVal = "hi";
  elAnswer.classList.remove("ok","bad");
  elFeedback.textContent = ""; elFeedback.className = "feedback";
  setEnterLabel();
  render();
}

function submit(){
  if(answered) return;
  if(!buffer.trim()) return;
  let guessCode = NAME_TO_CODE[norm(buffer)];
  if(!guessCode){ const m = computeMatches(buffer); if(m.length) guessCode = NAME_TO_CODE[norm(m[0])]; }
  if(!guessCode){
    elFeedback.textContent = "Keep typing…"; elFeedback.className = "feedback muted"; return;
  }
  answered = true; total++;
  const answerName = STATES[current].name;
  buffer = STATES[guessCode].name.toLowerCase();
  if(guessCode === current){
    correct++; streak++;
    if(streak>best){ best=streak; localStorage.setItem("nts_best",best); elBest.textContent=best; }
    paths[current].className.baseVal = "ok";
    elAnswer.classList.add("ok");
    elFeedback.textContent = "✓ Correct — " + answerName; elFeedback.className = "feedback ok";
  } else {
    streak = 0;
    paths[current].className.baseVal = "ok";
    elAnswer.classList.add("bad");
    elFeedback.textContent = "✗ That's " + answerName; elFeedback.className = "feedback bad";
  }
  elStreak.textContent = streak; elScore.textContent = correct + "/" + total;
  setEnterLabel();
  render();
}

// ---- on-screen keyboard ----
const LAYOUT = [
  ["Q","W","E","R","T","Y","U","I","O","P"],
  ["A","S","D","F","G","H","J","K","L"],
  ["Z","X","C","V","B","N","M","back"],
  ["space","enter"]
];
let enterBtn = null;
function setEnterLabel(){ if(enterBtn) enterBtn.textContent = answered ? "Next" : "Enter"; }

function handleKey(act, ch){
  if(answered){ if(act==="enter") nextQuestion(); return; }
  if(act==="char"){ if(buffer.replace(/\s/g,"").length < 20) buffer += ch.toLowerCase(); }
  else if(act==="space"){ if(buffer && !buffer.endsWith(" ")) buffer += " "; }
  else if(act==="back"){ buffer = buffer.slice(0,-1); }
  else if(act==="enter"){ submit(); return; }
  render();
}

LAYOUT.forEach(row=>{
  const r = document.createElement("div"); r.className = "krow";
  row.forEach(key=>{
    const b = document.createElement("button"); b.className = "key";
    if(key==="back"){ b.textContent="⌫"; b.classList.add("wide"); b.dataset.act="back"; }
    else if(key==="space"){ b.textContent="space"; b.classList.add("space"); b.dataset.act="space"; }
    else if(key==="enter"){ b.textContent="Enter"; b.classList.add("go"); b.dataset.act="enter"; enterBtn=b; }
    else { b.textContent=key; b.dataset.act="char"; b.dataset.ch=key; }
    b.addEventListener("click", ()=> handleKey(b.dataset.act, b.dataset.ch));
    r.appendChild(b);
  });
  elKb.appendChild(r);
});

// ---- physical keyboard (desktop) ----
document.addEventListener("keydown", e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="Enter"){ e.preventDefault(); handleKey("enter"); }
  else if(e.key==="Backspace"){ e.preventDefault(); handleKey("back"); }
  else if(e.key===" "){ e.preventDefault(); handleKey("space"); }
  else if(/^[a-zA-Z]$/.test(e.key)){ handleKey("char", e.key); }
});

nextQuestion();
</script>
